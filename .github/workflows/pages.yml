# Builds the wasm spike in `web/` and publishes it to GitHub Pages.
#
# **The module is never committed.** It is 25.7 MB, which is ten times this
# whole repository, and git history is permanent — so it is built here and
# handed straight to the Pages artifact. Nothing in `web/pkg/` or `web/target/`
# ever enters a commit.
#
# This builds `web/` alone. The workspace — `app` — is not touched, and `web/`
# is not one of its members, so nothing here can change what a phase's exit gate
# runs.
name: pages

on:
  push:
    branches: [main]
    # The spike is the only thing this publishes, so nothing else needs to
    # trigger a five-minute wasm build.
    #
    # `core/**` left this list with `mpdf-011` Phase 1: the engine is a
    # dependency of `web/Cargo.toml` rather than a directory beside it, so there
    # is no `core/` in this repository to watch. A new engine version reaches
    # the page through a commit to that manifest or to `web/Cargo.lock`, both of
    # which `web/**` covers. It was a git revision until `mpdf-011` Phase 3 and
    # is `md2pdf-core = "0.1"` off the registry since.
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a superseded build is not worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Typst is a large tree and dominates the build. Without this the job
      # recompiles it on every push.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> target

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build the module
        working-directory: web
        run: wasm-pack build --target web --release

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp web/index.html _site/
          cp -r web/pkg _site/pkg
          # `.gitignore` inside pkg/ would make the upload skip the module.
          rm -f _site/pkg/.gitignore
          echo "--- what is being published ---"
          find _site -type f -exec ls -lh {} \; | awk '{print $5, $9}'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
