# Builds the site and publishes it to GitHub Pages: the landing page at the
# root, and Letur's own window at `app/` over the session `web/` compiles to
# WebAssembly — `ltr-001` Phase 2. `web/assemble.sh` says what goes where.
#
# **The module is never committed.** It is 25.7 MB, which is ten times this
# whole repository, and git history is permanent — so it is built here and
# handed straight to the Pages artifact. Nothing in `web/pkg/` or `web/target/`
# ever enters a commit.
#
# It builds `web/` and reads two directories beside it: `project/`, which
# `web/Cargo.toml` takes by path, and `app/dist/`, whose page the site copies.
# `web/` is not a workspace member, so nothing here changes what a phase's exit
# gate runs.
name: pages

on:
  push:
    branches: [main]
    # What the site is built from, and nothing else, since a push elsewhere
    # does not need a five-minute wasm build: the module (`web/`, and the rules
    # it takes by path in `project/`), the window (`app/dist/`), and this file.
    #
    # `core/**` left this list with `mpdf-011` Phase 1: the engine is a
    # dependency of `web/Cargo.toml` rather than a directory beside it, so there
    # is no `core/` in this repository to watch. A new engine version reaches
    # the page through a commit to that manifest or to `web/Cargo.lock`, both of
    # which `web/**` covers. It was a git revision until `mpdf-011` Phase 3 and
    # is `md2pdf-core = "0.4"` off the registry since.
    paths:
      - 'web/**'
      - 'project/**'
      - 'app/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a superseded build is not worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Typst is a large tree and dominates the build. Without this the job
      # recompiles it on every push.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> target

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build the module
        working-directory: web
        run: wasm-pack build --target web --release

      - name: Assemble the site
        run: bash web/assemble.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
