[package]
name = "letur"
description = "Letur — the desktop front end for md2pdf-core: it shows the PDF while you write."
# **Letur's own version, inline rather than inherited.** `mpdf-011` Phase 1 took
# `version` out of the workspace table: a product versions by release and the
# engine it depends on versions by API, so one number cannot serve both.
# `app/tauri.conf.json` carries no `"version"` key either — Tauri falls back to
# this one, which is the duplication removed rather than guarded against.
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "letur"
path = "src/main.rs"

# Every version is pinned, as core pins the Typst crates: a window is the part
# of this project whose behaviour a minor release can change under it. The empty
# feature lists are the Tauri CLI's own normalisation, and it rewrites them on
# every `cargo tauri dev`, so they are kept rather than fought.
[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# `serde_json` was a dev-dependency until `mpdf-010` Phase 1, when the one fact
# this app remembers about a project — which file under a root compiles — went
# into a JSON object in Application Support, and reading it became something the
# app does rather than something a test does. **The mitigating fact survives the
# move**: it is already in `Cargo.lock` at this version by way of `tauri`, so
# promoting it adds no crate to the tree. It still serves the test comparing the
# front end's `Status` typedef to a serialized `Status`, which is what it was
# here for.
#
# `objc2-foundation` arrived with `mpdf-010` Phase 4, when a delete became a move
# to the Trash rather than an unlink. **The mitigating fact is `serde_json`'s
# again**: it is already in `Cargo.lock` at this version by way of `tauri`, so
# declaring it adds no crate to the tree. The `trash` crate was the alternative
# and is the *same call* underneath — its macOS implementation is
# `NSFileManager::trashItemAtURL_resultingItemURL_error` — for one more compiled
# crate and 206 lines of listing and restore this app never calls. The cost is
# stated rather than hidden: one more version this app pins itself rather than
# inherits. No `target.'cfg(...)'` table, because this binary is macOS only by
# construction and `src/main.rs` says so.
[dependencies]
# **The engine, from the registry.** `mpdf-011` Phase 3 published `md2pdf-core`
# and this line took its version. `"0.3"` and not `"=0.3.0"`, per that spec's
# OQ-5: a patch release arrives without a commit here, and what would reopen the
# question is the first engine patch that moves a number
# `rules/desktop-panes.md` measures off its frozen showcase.
#
# **A minor release is a commit here, because under `0.x` it is the breaking
# one.** `"0.1"` stopped at 0.1.3; 0.2.0 added the diagram fence and 0.3.0 the
# URL image, each with an `Error` variant, and this line took both at once —
# 0.3.0's showcase PDF and Typst source are byte-identical to 0.1.3's, so the
# condition above is still unspent. 0.4.0 took task lists into the dialect and
# made an article one column unless it says `columns: 2`, with no new variant —
# its two new refusals are `Error::UnsupportedConstruct`'s. The showcase says
# `columns: 1` itself, and its PDF is still byte-identical to 0.1.3's: 138,441
# bytes under both, measured 2026-09-25 by `mpdf-006` Phase 5. **The diagram renderer has a cost, and it
# is stated**: `merman` declares Rust 1.95 as its floor, and it links three
# MPL-2.0 crates into this binary (`cssparser`, `dtoa-short`, `selectors`) beside
# the one Tauri already brought, `option-ext`. The README's licence section says
# where all four crates' source is.
#
# It was a git revision at the split, pinned to the engine's `main`, and that
# shape stays the documented seam rather than a workaround: a `{ git, rev }`
# table is what this line becomes again between any two publishes Letur cannot
# wait for. **Spelled without the `=` on purpose** — Phase 3's gate 3 greps
# these two manifests for that literal and requires nothing back, and a comment
# is not worth blunting the check that proves the dependency left.
md2pdf-core = "0.4"
notify = "8.2.0"
objc2-foundation = { version = "0.3.2", features = [
  "NSError",
  "NSFileManager",
  "NSString",
  "NSURL",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
# **The engine's CLI's own client, spelled as `cli/Cargo.toml` spells it**, for
# the one request this app makes: an image the document names by URL, from a site
# the author allowed. `mpdf-003` Phase 25. `core` stays network-free, and a
# caller that fetches supplies the bytes. **The defaults are off for the CLI's
# reasons**: no `gzip`, so the size cap counts exactly the bytes `core` is
# handed, and no cookies, so a fetch keeps no state. `rustls` brings TLS with the
# bundled webpki roots, which trust the same roots on every machine. **The cost
# is stated**: thirteen crates join the lock, and twelve of them compile on
# macOS — `windows-sys` is the thirteenth. `ring` is Apache-2.0 and ISC,
# `rustls-webpki` and `untrusted` are ISC, `subtle` is BSD-3-Clause, and
# `webpki-roots` is CDLA-Permissive-2.0 data. The spec's OQ-20 carries the notice
# those licences ask for.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

# **The WebDriver server is behind this feature and reaches a shipped build
# through nothing else.** `tauri-plugin-wdio-webdriver` is an in-process W3C
# server on `127.0.0.1:4445`; `app/driver/drive.mjs` is the only thing that asks
# for it, and `cargo build -p letur --features driven` is the only build that
# carries it. `dep:` and not a bare name, so enabling the feature is the only way
# the optional dependency is pulled in.
#
# **Not `[target.'cfg(debug_assertions)'.dependencies]`**, which is what
# WebdriverIO's own setup page prescribes and which selects nothing. Cargo says
# so outright — "Found `debug_assertions` in `target.'cfg(...)'.dependencies`.
# This value is not supported for selecting dependencies and will not work as
# expected" — so under the documented incantation the crate is compiled and
# linked into a **release** build and only the `init()` call is gated. A feature
# is what actually keeps it out, and `cargo tree -p letur -e normal` is what
# says so.
#
# **No capability entry belongs with this**, and the next reader is warned off
# it in `rules/desktop.md`: the plugin declares no command, so a
# `wdio-webdriver:default` in `capabilities/default.json` grants nothing when it
# is present and fails the build when it is not.
[features]
driven = ["dep:tauri-plugin-wdio-webdriver"]
