# Letur in a browser tab: the window's session, compiled to WebAssembly.
#
# It began as `mpdf-006`'s spike — does `md2pdf-core` run as WebAssembly at
# all, what does the module cost over the wire, does Safari agree with Chromium
# — and all three still hold. `ltr-001` Phase 2 made it the session behind
# Letur's own window: `src/lib.rs` answers the commands `app/dist/index.html`
# sends, over a project held in memory, through the same `letur-project` rules
# the desktop answers through. `web/host/` is the JavaScript that carries them.
#
# **Named `letur_web` since that phase** (`ltr-001` OQ-6), so the module is
# `pkg/letur_web_bg.wasm`. The spike's name was kept while renaming it would have
# broken the published page to no end; that phase rewrote the page, the
# workflow and the module around it anyway.
#
# **Deliberately not a workspace member.** The empty `[workspace]` table below
# detaches it from the root workspace, so `cargo build --workspace` and
# `cargo test --workspace` — which every phase's exit gate runs — behave exactly
# as they did before this directory existed. `letur-project` is reached by path.
#
# **`Cargo.lock` is seeded from the published `md2pdf-cli`'s**, so every package
# the two share resolves to the CLI's version. `web/check.mjs` compares this
# module's PDFs with that CLI's byte for byte, and Typst breaks lines with
# `icu_segmenter`'s compiled data: the engine's version alone is not the graph.
[workspace]

[package]
name = "letur_web"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The engine, from the registry — the same dependency `app/Cargo.toml` takes,
# spelled the same way.
md2pdf-core = "0.4"
# The rules the window answers through: `Files`, `MemFiles`, `Preview`.
letur-project = { path = "../project" }
# **Every structured answer crosses as a JSON string**, from the serializer
# Tauri's IPC uses on the desktop. `serde-wasm-bindgen` was refused: it turns
# `None` into `undefined`, and the window hides its bars on `=== null`
# (`ltr-001` §2). Already in the tree through `md2pdf-core`.
serde_json = "1.0.151"
wasm-bindgen = "0.2.104"
console_error_panic_hook = "0.1.7"

# The module is the whole download, so it is optimised for size rather than
# speed. Measured on 2026-08-15: 25.7 MB raw, 7.8 MB brotli. The fonts are
# 2.5 MB of that; the rest is Typst and the PDF writer.
#
# That is a dated measurement and not the current figure. The number the record
# tracks is `web/pkg/letur_web_bg.wasm` in the tree, and `rules/web-app.md`
# carries its latest measurement, and carries it once.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
